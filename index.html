<!DOCTYPE html>
<!--
  ============================================================================
  Exchange Reality Check
  ============================================================================
  A self-contained rebuild of "Studying abroad for a semester, a 5-minute
  survey" (the original Google Form) as a tap-first, chat-style, gamified
  micro-survey. One HTML file: all markup, styles and logic live here on
  purpose, nothing to build, no bundler, just open it or host it as-is.

  DESIGN
    The visual language is a check-in desk: every question is presented on
    a paper ticket card, floating on a dusk-navy background, and the final
    screen is a real boarding pass built from the respondent's own answers
    (their name, their category mapped to a flight status, a generated
    sequence code, even a one-off barcode). Typefaces: Fraunces for
    headlines, IBM Plex Sans for body and controls, IBM Plex Mono for the
    ticket-style data fields (sequence numbers, status line). See the
    <style> block for the full token system.

  WHAT CHANGED FROM THE ORIGINAL FORM, AND WHY (for whoever maintains this):
    - Email moved from question #1 to the very end, paired with the result
      reveal (where to send what we find), instead of being the first,
      highest-friction thing a stranger sees. It is still required: this is
      how we reach people with real numbers later, not an afterthought.
    - The form's long "Knowledge probe" section opens with Q10 (cost guess)
      turned into the FIRST real question, a zero-knowledge-required guess
      that creates a reason to keep going (the reveal), rather than nine
      quiz-feeling questions in a row.
    - Every question is one screen, tap-first where possible. Long free-text
      questions stay free text (there's no substitute for someone's own
      words) but are skippable unless they're load-bearing for the research
      (the Branch C "went/going" question set stays required, since that
      group is explicitly the rarest and most useful).
    - The branching in the live Google Form routes EVERY respondent past
      "Section 2 (PG Specific)" by default (its "After section 1" rule
      points straight to Section 3), so right now, in production, PG
      students never actually see that question. This rebuild fixes that:
      the PG-specific question fires whenever Q2's answer is a postgraduate
      programme, regardless of anything else.
    - Section 4's category router (Q18) has 6 options but only 3 follow-up
      sections existed in the form. Reading Q28's options ("I was rejected
      or not selected", "I got selected but chose not to go") confirms the
      intended mapping, which this rebuild makes explicit:
        Q18 option 1 or 2 (never seriously considered / thought about it,
          never started)                 -> Branch A (never applied)
        Q18 option 3, 4 or 5 (started but didn't finish / applied, not
          selected / selected, didn't go)
                                          -> Branch B (started but didn't finish)
        Q18 option 6 (been on exchange / on one now)
                                          -> Branch C (went / going)

  ARCHITECTURE
    - FLOW (below) is pure data: an ordered list of "step" objects per
      tier/branch. Adding, reordering or rewording a question is a data
      edit, not a UI rewrite.
    - Every answer is written the instant it's given, to THREE places in
      parallel, each independently retried with exponential backoff:
        1. localStorage (so a refresh/closed tab resumes exactly where you
           left off; this is also where everything lives if Supabase isn't
           configured yet, see CONFIG below)
        2. Supabase `answers` table (insert-only from the browser; see
           supabase/schema.sql for the full schema and RLS policies)
        3. a Google Apps Script Web App that mirrors the same row into a
           Sheet (see google-apps-script/sync.gs), best-effort; Supabase is
           the source of truth if the two ever disagree
    - Live peer stats are read from a PUBLIC, PII-free aggregate view
      (`question_stats` / `survey_progress` in schema.sql); the browser
      never reads back raw rows, only counts.

  SETUP
    See README.md. Short version: fill in CONFIG below with your Supabase
    project URL/anon key and your deployed Apps Script Web App URL, then
    host this one file anywhere static (GitHub Pages, Vercel, Netlify, or
    just double-click it to test the flow locally in "demo mode").
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Exchange Reality Check</title>
<meta name="description" content="A two-minute reality check on studying abroad for a semester: guess, compare, and tell us what actually stopped you.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,560;9..144,650&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- Supabase JS v2 (UMD build) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- html2canvas, used only to rasterize the shareable boarding pass -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ==========================================================================
   DESIGN TOKENS
   A check-in desk, not a chat app: dusk-navy canvas, cream ticket cards,
   a single airmail red for action and ink. Fraunces carries the voice in
   headlines; IBM Plex Sans runs the body and controls; IBM Plex Mono is
   reserved for ticket-style data (sequence codes, the status line) so it
   reads as functional print, not decoration.
   ========================================================================== */
:root {
  --navy-900: #0A1C2B;
  --navy-800: #123049;
  --navy-700: #214A68;
  --navy-600: #2E6186;

  --paper: #F7F1E2;
  --paper-dim: #EEE4C8;
  --paper-edge: #DED0A8;

  --ink: #1C2B33;
  --ink-soft: rgba(28,43,51,0.62);
  --ink-faint: rgba(28,43,51,0.4);

  --cream: #F3ECDC;
  --cream-soft: rgba(243,236,220,0.68);
  --cream-faint: rgba(243,236,220,0.42);

  --red: #B23A2E;
  --red-dark: #8C2C22;
  --red-soft: rgba(178,58,46,0.12);
  --brass: #A9793C;
  --success: #3F7D58;
  --success-soft: rgba(63,125,88,0.14);

  --radius-card: 0.85rem;
  --radius-md: 0.6rem;
  --radius-sm: 0.4rem;
  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2.25rem;

  --max-width: 27rem;
  --touch-min: 2.9rem;

  --font-display: 'Fraunces', Georgia, 'Iowan Old Style', serif;
  --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --fs-title: clamp(1.45rem, 1.15rem + 1.4vw, 1.85rem);
  --fs-body: 1rem;
  --fs-subtitle: 0.95rem;
  --fs-small: 0.82rem;
  --fs-micro: 0.72rem;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; min-height: 100vh;
  font-family: var(--font-body);
  color: var(--cream);
  background:
    radial-gradient(ellipse 90% 60% at 18% -8%, var(--navy-700) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 100% 100%, var(--navy-700) 0%, transparent 55%),
    linear-gradient(180deg, var(--navy-800) 0%, var(--navy-900) 70%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
h1, h2, h3, p, dl, dd, dt { margin: 0; }
button, input, textarea { font-family: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* ==========================================================================
   SHELL + DESKTOP SPLIT LAYOUT
   Mobile: a single paper card centered on the navy canvas. From 880px up,
   a fixed left panel (the "departure board") appears beside the card, so
   the wide viewport isn't just a stretched phone screen.
   ========================================================================== */
.app-root { width: 100%; min-height: 100dvh; display: flex; justify-content: center; }
.app-shell {
  width: 100%; max-width: var(--max-width);
  min-height: 100dvh;
  display: flex; flex-direction: column;
  padding: calc(var(--space-2) + env(safe-area-inset-top, 0)) var(--space-2) var(--space-4);
  position: relative;
}

.side-panel { display: none; }

@media (min-width: 880px) {
  .app-root { gap: 0; align-items: stretch; }
  .side-panel {
    display: flex; flex-direction: column; justify-content: space-between;
    width: 23rem; flex-shrink: 0;
    padding: 3.5rem 3rem;
    background:
      radial-gradient(ellipse 80% 50% at 15% 0%, var(--navy-700) 0%, transparent 60%),
      var(--navy-900);
    border-right: 1px solid var(--navy-700);
    position: sticky; top: 0; height: 100dvh;
  }
  .app-shell { padding-top: 3.5rem; padding-left: var(--space-3); padding-right: var(--space-3); }
  /* The stage list on the left already names the section; don't say it twice. */
  .header-status { visibility: hidden; }
}

.side-wordmark {
  font-family: var(--font-mono); font-size: var(--fs-micro); font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass);
}
.side-headline {
  font-family: var(--font-display); font-weight: 560; font-size: 1.9rem;
  line-height: 1.22; color: var(--cream); margin-top: 1.1rem;
}
.route-graphic { margin-top: 2.5rem; position: relative; }
.route-svg { width: 100%; height: 2.6rem; display: block; }
.route-plane {
  position: absolute; top: 50%; left: 4%;
  transform: translate(-50%, -50%) rotate(90deg);
  font-size: 0.95rem; color: var(--red);
  transition: left 0.6s var(--ease);
}
.route-labels {
  display: flex; justify-content: space-between;
  font-family: var(--font-mono); font-size: var(--fs-micro); letter-spacing: 0.06em;
  color: var(--cream-soft); margin-top: 0.3rem;
}
/* Stage list: tells people what's coming without ever showing a question count. */
.stage-list { margin: 2.5rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.95rem; }
.stage-item { display: flex; align-items: center; gap: 0.8rem; font-size: var(--fs-subtitle); color: var(--cream-faint); transition: color 0.3s; }
.stage-mark {
  width: 1.15rem; height: 1.15rem; flex-shrink: 0; border-radius: 999px;
  border: 1.5px solid var(--cream-faint);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.66rem; line-height: 1;
}
.stage-item.current { color: var(--cream); font-weight: 600; }
.stage-item.current .stage-mark { border-color: var(--red); background: var(--red); box-shadow: 0 0 0 4px rgba(178,58,46,0.22); }
.stage-item.done { color: var(--cream-soft); }
.stage-item.done .stage-mark { border-color: var(--success); background: var(--success); color: var(--paper); }
.stage-item.done .stage-mark::after { content: "\2713"; }
.side-footnote { font-size: var(--fs-small); color: var(--cream-faint); line-height: 1.5; margin-top: 2rem; }

/* The welcome screen is a plain landing card: no stage label or progress
   rule above it, since there's no progress to report yet. */
body.is-welcome .app-header { display: none; }
@media (max-width: 879px) { body.is-welcome .step-stage { justify-content: flex-start; } }

.welcome-eyebrow {
  font-family: var(--font-mono); font-size: var(--fs-micro); font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--red);
  margin-bottom: -0.5rem;
}
.welcome-points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.55rem; }
.welcome-points li { display: flex; gap: 0.65rem; align-items: flex-start; font-size: var(--fs-subtitle); color: var(--ink); line-height: 1.45; }
.welcome-points li::before {
  content: ""; width: 0.4rem; height: 0.4rem; margin-top: 0.5rem; flex-shrink: 0;
  border-radius: 999px; background: var(--red);
}
.welcome-meta {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0.3rem 0.6rem;
  font-size: var(--fs-small); color: var(--ink-soft);
}
.welcome-meta span + span::before { content: "\00B7"; margin-right: 0.6rem; color: var(--ink-faint); }
.field-hint { font-weight: 400; color: var(--ink-faint); }

/* ==========================================================================
   HEADER / PROGRESS
   One persistent status line (section name + a running count), not a label
   repeated above every heading. The rule underneath is the only "progress
   bar": thin, flat, no mascot riding along it.
   ========================================================================== */
.app-header { display: flex; flex-direction: column; gap: 0.6rem; padding-bottom: var(--space-2); }
.header-row { display: flex; align-items: center; justify-content: space-between; min-height: 2.4rem; }
.back-btn {
  width: var(--touch-min); height: var(--touch-min);
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; color: var(--cream-soft);
  border-radius: 999px; cursor: pointer; font-size: 1.15rem;
  transition: background 0.15s;
  visibility: hidden;
}
.back-btn.visible { visibility: visible; }
.back-btn:hover, .back-btn:active { background: rgba(243,236,220,0.08); }
.header-status {
  font-family: var(--font-mono); font-size: var(--fs-micro); font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--cream-soft);
}
.progress-track { height: 2px; background: rgba(243,236,220,0.16); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--red); transition: width 0.45s var(--ease); }

/* ==========================================================================
   THE TICKET CARD
   Every question is a paper card: a shallow die-cut notch at the top edge
   (matching the navy canvas) is the one consistent detail tying every
   screen to the boarding-pass finale.
   ========================================================================== */
.step-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: var(--space-2) 0; }
.step-card {
  background: var(--paper);
  border: 1px solid var(--paper-edge);
  border-radius: var(--radius-card);
  padding: var(--space-3);
  display: flex; flex-direction: column; gap: var(--space-2);
  box-shadow: 0 18px 40px rgba(5,14,22,0.35);
  position: relative;
  animation: cardIn 0.32s var(--ease);
}
.step-card::before, .step-card::after {
  content: ""; position: absolute; top: -0.5rem; width: 1rem; height: 1rem;
  background: var(--navy-900); border-radius: 999px;
}
.step-card::before { left: 1.1rem; }
.step-card::after { right: 1.1rem; }
@media (prefers-reduced-motion: no-preference) {
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
}
@media (prefers-reduced-motion: reduce) { .step-card { animation: none; } }

.step-title { font-family: var(--font-display); font-size: var(--fs-title); font-weight: 580; line-height: 1.22; color: var(--ink); letter-spacing: -0.005em; }
.step-subtitle { font-size: var(--fs-subtitle); color: var(--ink-soft); line-height: 1.55; }
.slider-hint { font-size: var(--fs-small); color: var(--ink-faint); }

/* ==========================================================================
   OPTION LIST (vertical, for longer or nuanced choices)
   ========================================================================== */
.options-list { display: flex; flex-direction: column; gap: 0.5rem; }
.option-card {
  display: flex; align-items: center; gap: 0.75rem;
  min-height: var(--touch-min);
  padding: 0.8rem 1rem;
  background: #fff; border: 1px solid var(--paper-edge);
  border-radius: var(--radius-md);
  color: var(--ink);
  font-size: var(--fs-body); text-align: left; line-height: 1.4;
  cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.option-card:active { transform: scale(0.99); }
.option-card.selected { background: var(--red-soft); border-color: var(--red); }
.option-dot {
  width: 1.05rem; height: 1.05rem; flex-shrink: 0;
  border-radius: 999px; border: 1.5px solid var(--ink-faint);
  display: flex; align-items: center; justify-content: center;
}
.option-card.selected .option-dot { border-color: var(--red); background: var(--red); }
.option-dot::after { content: ""; width: 0.45rem; height: 0.45rem; border-radius: 999px; background: var(--paper); transform: scale(0); transition: transform 0.15s; }
.option-card.selected .option-dot::after { transform: scale(1); }
.option-card.chip .option-dot { border-radius: 0.25rem; }
.option-card.chip .option-dot::after { border-radius: 0.1rem; }

/* Segmented pill row, for short discrete choices (year, gender, yes/no) */
.options-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.option-pill {
  min-height: var(--touch-min); padding: 0.6rem 1.1rem;
  background: #fff; border: 1px solid var(--paper-edge); border-radius: 999px;
  color: var(--ink); font-size: var(--fs-body); font-weight: 500;
  cursor: pointer; transition: all 0.15s var(--ease);
  flex: 1 1 auto; text-align: center;
}
.option-pill:active { transform: scale(0.97); }
.option-pill.selected { background: var(--red); border-color: var(--red); color: var(--paper); }

/* ==========================================================================
   SCALE (1-5)
   ========================================================================== */
.scale-row { display: flex; justify-content: space-between; gap: 0.4rem; }
.scale-dot {
  flex: 1; aspect-ratio: 1; max-width: 3rem;
  border-radius: 999px; border: 1.5px solid var(--paper-edge);
  background: #fff; color: var(--ink);
  font-family: var(--font-mono); font-weight: 600; font-size: var(--fs-body);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s var(--ease);
}
.scale-dot:active { transform: scale(0.92); }
.scale-dot.selected { background: var(--red); border-color: var(--red); color: var(--paper); }
.scale-labels { display: flex; justify-content: space-between; font-size: var(--fs-small); color: var(--ink-faint); padding: 0 0.1rem; }

/* ==========================================================================
   SLIDER + PAIRED NUMBER ENTRY
   ========================================================================== */
.slider-value { font-family: var(--font-display); font-size: 2.1rem; font-weight: 580; color: var(--red); }
input[type="range"] {
  -webkit-appearance: none; width: 100%; height: 0.4rem;
  border-radius: 999px; background: var(--paper-edge);
  outline: none; margin: 0.5rem 0;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 1.4rem; height: 1.4rem; border-radius: 999px;
  background: var(--red); border: 3px solid var(--paper);
  box-shadow: 0 1px 6px rgba(0,0,0,0.3); cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 1.4rem; height: 1.4rem; border-radius: 999px; border: 3px solid var(--paper);
  background: var(--red); cursor: pointer;
}
.exact-amount-row { display: flex; align-items: center; gap: 0.5rem; }
.exact-amount-row label { font-size: var(--fs-small); color: var(--ink-soft); flex-shrink: 0; }
.exact-amount-input {
  width: 100%; padding: 0.55rem 0.7rem;
  background: #fff; border: 1px solid var(--paper-edge); border-radius: var(--radius-sm);
  color: var(--ink); font-family: var(--font-mono); font-size: var(--fs-body);
}
.no-idea-btn {
  align-self: flex-start; font-size: var(--fs-small); color: var(--ink-soft);
  background: transparent; border: 1px dashed var(--ink-faint);
  border-radius: 999px; padding: 0.45rem 0.9rem; cursor: pointer;
}
.no-idea-btn.active { color: var(--red); border-color: var(--red); border-style: solid; }

/* ==========================================================================
   TEXT INPUTS
   ========================================================================== */
.text-input, .textarea-input {
  width: 100%; padding: 0.85rem 1rem;
  background: #fff; border: 1px solid var(--paper-edge);
  border-radius: var(--radius-md); color: var(--ink);
  font-size: var(--fs-body); font-family: inherit; line-height: 1.5;
  resize: vertical;
}
.text-input:focus, .textarea-input:focus { outline: none; border-color: var(--red); }
.text-input::placeholder, .textarea-input::placeholder { color: var(--ink-faint); }
.textarea-input { min-height: 4.75rem; }
/* Speak-instead control for written answers: talking is far easier than
   typing on a phone, and it's still the respondent's own words. */
.voice-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-top: -0.4rem; }
.voice-btn {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font-size: var(--fs-small); font-weight: 500; color: var(--ink-soft);
  background: transparent; border: 1px solid var(--paper-edge);
  border-radius: 999px; padding: 0.45rem 0.9rem; cursor: pointer;
  min-height: 2.25rem; white-space: nowrap; flex-shrink: 0;
}
.voice-btn svg { width: 0.95rem; height: 0.95rem; }
.voice-btn.listening { color: #fff; background: var(--red); border-color: var(--red); }
@media (prefers-reduced-motion: no-preference) {
  .voice-btn.listening svg { animation: micPulse 1.1s ease-in-out infinite; }
  @keyframes micPulse { 50% { opacity: 0.45; } }
}
.answer-hint { font-size: var(--fs-small); color: var(--ink-faint); transition: color 0.2s; }
.answer-hint.ok { color: var(--success); }
.field-label { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 500; }
.quick-fill-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.quick-fill-btn {
  font-size: var(--fs-small); color: var(--ink-soft);
  background: transparent; border: 1px dashed var(--ink-faint);
  border-radius: 999px; padding: 0.4rem 0.85rem; cursor: pointer;
}

/* ==========================================================================
   ACTION ROW
   ========================================================================== */
.action-row { display: flex; gap: 0.6rem; margin-top: 0.2rem; }
.btn {
  flex: 1; min-height: var(--touch-min);
  border-radius: var(--radius-md); border: none;
  font-size: var(--fs-body); font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 0.4rem;
  transition: transform 0.12s, opacity 0.15s, background 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-dark); }
.btn-primary[disabled] { opacity: 0.35; pointer-events: none; }
.btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--paper-edge); flex: 0 0 auto; padding: 0 1.1rem; }
.btn-full { flex: 1; }

/* ==========================================================================
   STAT REVEAL + UNLOCK BAR
   ========================================================================== */
.stat-row { display: flex; flex-direction: column; gap: 0.5rem; }
.stat-pill {
  display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  padding: 0.75rem 1rem; background: var(--paper-dim);
  border-radius: var(--radius-md); font-size: var(--fs-small); color: var(--ink-soft);
}
.stat-pill b { color: var(--red); font-family: var(--font-mono); font-size: var(--fs-body); font-weight: 600; }
.unlock-bar-wrap { margin-top: 0.1rem; }
.unlock-bar-track { height: 0.5rem; background: var(--paper-dim); border-radius: 999px; overflow: hidden; }
.unlock-bar-fill { height: 100%; background: var(--success); border-radius: 999px; transition: width 0.6s var(--ease); }
.unlock-bar-label { font-size: var(--fs-small); color: var(--ink-faint); margin-top: 0.35rem; }

  unlockTarget: 150,

/* ============================================================================

function showToast(message, ms = 2800) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, ms);
}

function showModal({ title, body, actions }) {
  const root = document.getElementById('modal-root');
  const sheet = document.getElementById('modalSheet');
  sheet.innerHTML = '';
  if (title) { const t = el('div', 'modal-title', title); sheet.appendChild(t); }
  if (body) { const b = el('div', 'modal-body', body); sheet.appendChild(b); }
  const row = el('div', 'modal-actions');
  (actions || [{ label: 'Close', primary: true, onClick: closeModal }]).forEach(a => {
    const btn = el('button', 'btn ' + (a.primary ? 'btn-primary' : 'btn-ghost'), a.label);
    btn.onclick = () => { if (a.onClick) a.onClick(); closeModal(); };
    row.appendChild(btn);
  });
  sheet.appendChild(row);
  root.classList.add('open');
}
function closeModal() { document.getElementById('modal-root').classList.remove('open'); }

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text != null) e.textContent = text;
  return e;
}

/** Generic exponential-backoff retrier for any async fn that throws on failure. */
async function withBackoff(fn, { baseDelayMs, maxAttempts, maxDelayMs } = CONFIG) {
  let attempt = 0;
  while (true) {
    try { return await fn(); }
    catch (err) {
      attempt++;
      if (attempt >= (maxAttempts ?? CONFIG.retryMaxAttempts)) throw err;
      const delay = Math.min((baseDelayMs ?? CONFIG.retryBaseDelayMs) * 2 ** attempt, maxDelayMs ?? CONFIG.retryMaxDelayMs);
      const jitter = delay * (0.75 + Math.random() * 0.5);
      await new Promise(r => setTimeout(r, jitter));
    }
  }
}

const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
  const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16);
}));

/* ============================================================================
   3. PERSISTENCE: localStorage session/answers plus a durable write queue
      that survives a refresh, flushed with backoff to Supabase and/or
      Sheets.
   ========================================================================== */
const LS_KEY = 'erc_session_v2';
const LS_QUEUE_KEY = 'erc_write_queue_v2';

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch { return null; }
}
function saveLocal(data) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch { /* storage full or unavailable, non-fatal */ }
}
function loadQueue() {
  try { return JSON.parse(localStorage.getItem(LS_QUEUE_KEY)) || []; } catch { return []; }
}
function saveQueue(q) {
  try { localStorage.setItem(LS_QUEUE_KEY, JSON.stringify(q)); } catch { /* non-fatal */ }
}

let supabaseClient = null;
if (isConfigured.supabase && window.supabase) {
  supabaseClient = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
}

/** Enqueue a write (answer / session / contact) and kick off a flush attempt. */
function queueWrite(payload) {
  const q = loadQueue();
  q.push({ ...payload, _queuedAt: Date.now(), _id: uuid() });
  saveQueue(q);
  flushQueue(); // fire and forget; failures stay queued for the next trigger
}

let flushing = false;
async function flushQueue() {
  if (flushing) return;
  flushing = true;
  try {
    let q = loadQueue();
    const remaining = [];
    for (const item of q) {
      try {
        await withBackoff(() => sendOne(item), { maxAttempts: 2 }); // quick attempts here; full backoff happens via periodic retry below
      } catch {
        remaining.push(item); // still failing, keep for later
      }
    }
    saveQueue(remaining);
  } finally {
    flushing = false;
  }
}

async function sendOne(item) {
  const jobs = [];
  if (supabaseClient) jobs.push(sendToSupabase(item));
  if (isConfigured.sheets) jobs.push(sendToSheets(item));
  if (jobs.length === 0) return; // demo mode: localStorage only, nothing to send
  // Both destinations are best-effort and independent, so one failing
  // shouldn't block the other: await both, and only re-throw if BOTH
  // failed (meaning the item truly needs to stay queued).
  const results = await Promise.allSettled(jobs);
  if (results.every(r => r.status === 'rejected')) {
    throw results[0].reason;
  }
}

async function sendToSupabase(item) {
  if (item.kind === 'session') {
    const { error } = await supabaseClient.from('sessions').upsert({
      id: item.session_id, programme: item.programme, year: item.year,
      department: item.department, is_pg: item.is_pg, branch: item.branch,
      user_agent: item.user_agent, furthest_tier: item.furthest_tier,
      completed_at: item.completed_at || null,
    }, { onConflict: 'id' });
    if (error) throw error;
  } else if (item.kind === 'answer') {
    const { error } = await supabaseClient.from('answers').upsert({
      session_id: item.session_id, question_id: item.question_id, value: item.value,
    }, { onConflict: 'session_id,question_id' });
    if (error) throw error;
  } else if (item.kind === 'contact') {
    const { error } = await supabaseClient.from('contacts').upsert({
      session_id: item.session_id, email: item.email, phone_whatsapp: item.phone_whatsapp,
      ok_followup_contact: item.ok_followup_contact, ok_junior_contact: item.ok_junior_contact,
      ok_interview_contact: item.ok_interview_contact,
    }, { onConflict: 'session_id' });
    if (error) throw error;
  }
}

async function sendToSheets(item) {
  const res = await fetch(CONFIG.sheetsWebAppUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight against Apps Script
    body: JSON.stringify({ ...item, created_at: new Date().toISOString() }),
  });
  if (!res.ok) throw new Error('Sheets sync HTTP ' + res.status);
}

/* ============================================================================
   5. STATE
   ========================================================================== */
let session = loadLocal() || {
  session_id: uuid(), createdAt: Date.now(), answers: {}, branch: null,
  furthestTier: 0, pointer: { tier: 0, index: 0 }, completed: false,
};

function persistSession() {
  saveLocal(session);
}

function recordAnswer(questionId, value) {
  session.answers[questionId] = value;
  persistSession();
  queueWrite({ kind: 'answer', session_id: session.session_id, question_id: questionId, value });

  // Keep the session row's denormalized fields current for easy filtering.
  if (['q2_programme', 'q3_year', 'q4_department'].includes(questionId) || questionId === 'q18_category') {
    if (questionId === 'q2_programme') session.answers.is_pg = PROGRAMMES_PG.includes(value);
    if (questionId === 'q18_category') session.branch = routeBranch(value);
    pushSessionSnapshot();
  }
}

function pushSessionSnapshot() {
  queueWrite({
    kind: 'session', session_id: session.session_id,
    programme: session.answers.q2_programme, year: session.answers.q3_year,
    department: session.answers.q4_department, is_pg: !!session.answers.is_pg,
    branch: session.branch, user_agent: navigator.userAgent,
    furthest_tier: session.furthestTier, completed_at: session.completed ? new Date().toISOString() : null,
  });
}

function routeBranch(q18answer) {
  const idx = TIER1.find(s => s.id === 'q18_category').options.indexOf(q18answer);
  if (idx === 0 || idx === 1) return 'A';
  if (idx === 2 || idx === 3 || idx === 4) return 'B';
  if (idx === 5) return 'C';
  return null;
}

/* ============================================================================
   6. ROUTER: walks TIER0 -> TIER1 -> (branch A/B/C) -> TIER3 -> debrief,
      skipping any step whose condition() fails.
   ========================================================================== */
function branchList() {
  return session.branch === 'A' ? BRANCH_A : session.branch === 'B' ? BRANCH_B : session.branch === 'C' ? BRANCH_C : [];
}

function listForTier(tier) {
  if (tier === 0) return TIER0;
  if (tier === 1) return TIER1;
  if (tier === 2) return branchList();
  if (tier === 3) return TIER3;
  return [];
}

function stepAt(tier, index) {
  const list = listForTier(tier);
  return list[index] || null;
}

/** Finds the next visible step after {tier, index}, walking forward through tiers as lists end. */
function advancePointer(from) {
  let { tier, index } = from;
  index++;
  while (true) {
    const list = listForTier(tier);
    if (index < list.length) {
      const step = list[index];
      if (!step.condition || step.condition(session.answers)) return { tier, index };
      index++;
      continue;
    }
    // list exhausted, move to next tier
    if (tier === 0) { tier = 1; index = 0; continue; }
    if (tier === 1) { tier = 2; index = 0; if (branchList().length === 0) { tier = 3; index = 0; } continue; }
    if (tier === 2) { tier = 3; index = 0; continue; }
    if (tier === 3) return null; // -> debrief
  }
}

function retreatPointer(from) {
  let { tier, index } = from;
  index--;
  while (true) {
    if (index >= 0) {
      const step = stepAt(tier, index);
      if (step && (!step.condition || step.condition(session.answers))) return { tier, index };
      index--;
      continue;
    }
    if (tier === 3) { tier = 2; index = listForTier(2).length - 1; if (index < 0) { tier = 1; index = listForTier(1).length - 1; } continue; }
    if (tier === 2) { tier = 1; index = listForTier(1).length - 1; continue; }
    if (tier === 1) { tier = 0; index = listForTier(0).length - 1; continue; }
    return null; // already at the very first step
  }
}

/* ============================================================================
   7. RENDERER
   ========================================================================== */
const stage = document.getElementById('stepStage');
const backBtn = document.getElementById('backBtn');
const headerStatus = document.getElementById('headerStatus');
const progressFill = document.getElementById('progressFill');
const sideHeadline = document.getElementById('sideHeadline');
const stageList = document.getElementById('stageList');
const routePlane = document.getElementById('routePlane');
const routeDestLabel = document.getElementById('routeDestLabel');

// Section names double as the mobile header label and the desktop stage list.
// There is deliberately no question counter anywhere: a visible "1 / 30"
// makes people quit before they start; a short list of named stages and a
// progress rule tell them the same thing without the dread.
const TIER_LABELS = { 0: 'Getting started', 1: 'What you know', 2: 'Your story', 3: 'Wrapping up' };
const SIDE_HEADLINES = {
  0: 'A semester abroad, honestly.',
  1: 'No pressure. Guessing is fine.',
  2: { A: 'What’s actually in the way?', B: 'Where did it break down?', C: 'Tell us how it really went.' },
  3: 'Almost done.',
};
// Rough length of a branch before Q18 picks one, so the progress rule
// doesn't leap forward and then crawl once the branch is known.
const EST_BRANCH_LENGTH = 11;

backBtn.onclick = () => {
  stopVoice();
  const prev = retreatPointer(session.pointer);
  if (prev) { session.pointer = prev; persistSession(); render(); }
};

function render() {
  if (!session.pointer) { renderDebrief(); return; }
  const step = stepAt(session.pointer.tier, session.pointer.index);
  if (!step) { renderDebrief(); return; }

  session.furthestTier = Math.max(session.furthestTier, step.tier);
  document.body.classList.toggle('is-welcome', step.type === 'checkin');
  headerStatus.textContent = TIER_LABELS[step.tier] || '';
  backBtn.classList.toggle('visible', !(session.pointer.tier === 0 && session.pointer.index === 0));
  updateProgress(step.tier);

  const card = el('div', 'step-card');
  stage.innerHTML = '';
  stage.appendChild(card);
  window.scrollTo({ top: 0 });

  const renderers = {
    checkin: renderCheckin, info: renderInfo, slider: renderSlider, scale: renderScale, single: renderSingle,
    multi_chips: renderMultiChips, short_text: renderText, long_text: renderText,
    reveal: renderReveal, single_from_prior: renderSingleFromPrior,
  };
  (renderers[step.type] || renderInfo)(card, step);
}

function goNext() {
  stopVoice();
  const next = advancePointer(session.pointer);
  session.pointer = next;
  persistSession();
  render();
}

function commitAndAdvance(step, value) {
  if (value !== undefined) recordAnswer(step.id, value);
  goNext();
}

function updateProgress(currentTier) {
  // Rough estimate: steps behind us / all steps, using an assumed branch
  // length until Q18 has picked one.
  let total = 0, done = 0;
  for (const t of [0, 1, 2, 3]) {
    const len = (t === 2 && !session.branch) ? EST_BRANCH_LENGTH : listForTier(t).length;
    total += len;
    if (t < currentTier) done += len;
    else if (t === currentTier) done += session.pointer.index;
  }
  const pct = currentTier === 0 && session.pointer.index === 0 ? 0 : Math.min(96, Math.max(4, Math.round((done / Math.max(1, total)) * 100)));
  progressFill.style.width = pct + '%';
  routePlane.style.left = Math.max(4, pct) + '%';
  renderStageList(currentTier);
  let headline = SIDE_HEADLINES[currentTier];
  if (headline && typeof headline === 'object') headline = headline[session.branch] || 'Tell us how it really went.';
  sideHeadline.textContent = headline || sideHeadline.textContent;
}

function renderStageList(currentTier, allDone = false) {
  stageList.innerHTML = '';
  Object.entries(TIER_LABELS).forEach(([tier, label]) => {
    const t = Number(tier);
    const state = allDone || t < currentTier ? 'done' : t === currentTier ? 'current' : '';
    const li = el('li', 'stage-item ' + state);
    if (state === 'current') li.setAttribute('aria-current', 'step');
    li.appendChild(el('span', 'stage-mark'));
    li.appendChild(el('span', null, label));
    stageList.appendChild(li);
  });
}

/** Enter submits single-line inputs; Ctrl/Cmd+Enter submits a textarea. */
function submitOnEnter(input, btn) {
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (input.tagName === 'TEXTAREA' && !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    btn.click();
  });
}

/* ---- check-in (welcome + name) ---- */
function renderCheckin(card, step) {
  if (step.eyebrow) card.appendChild(el('div', 'welcome-eyebrow', step.eyebrow));
  card.appendChild(el('h2', 'step-title', step.title));
  card.appendChild(el('div', 'step-subtitle', step.subtitle));

  if (step.points) {
    const ul = el('ul', 'welcome-points');
    step.points.forEach(p => ul.appendChild(el('li', null, p)));
    card.appendChild(ul);
  }

  // The name only personalises the result card, so it never blocks starting.
  const label = el('label', 'field-label', step.nameLabel || 'Your name');
  label.htmlFor = 'respondentName';
  label.appendChild(el('span', 'field-hint', ' (optional)'));
  card.appendChild(label);
  const input = document.createElement('input');
  input.id = 'respondentName';
  input.className = 'text-input'; input.type = 'text'; input.autocomplete = 'given-name';
  input.placeholder = step.namePlaceholder || '';
  input.value = session.answers.respondent_name || '';
  card.appendChild(input);

  const row = el('div', 'action-row');
  const btn = el('button', 'btn btn-primary btn-full', step.primaryLabel || 'Continue');
  btn.onclick = () => {
    const name = input.value.trim();
    if (name) recordAnswer('respondent_name', name);
    goNext();
  };
  submitOnEnter(input, btn);
  row.appendChild(btn);
  card.appendChild(row);

  if (step.meta) {
    const meta = el('div', 'welcome-meta');
    step.meta.forEach(m => meta.appendChild(el('span', null, m)));
    card.appendChild(meta);
  }
}

/* ---- info ---- */
function renderInfo(card, step) {
  card.appendChild(el('div', 'step-title', step.title));
  if (step.subtitle) card.appendChild(el('div', 'step-subtitle', step.subtitle));
  const row = el('div', 'action-row');
  const btn = el('button', 'btn btn-primary btn-full', step.primaryLabel || 'Continue');
  btn.onclick = () => commitAndAdvance(step, undefined);
  row.appendChild(btn);
  card.appendChild(row);
}

/* ---- slider (Q10), paired with an exact-amount field ---- */
function renderSlider(card, step) {
  card.appendChild(el('div', 'step-title', step.title));
  if (step.subtitle) card.appendChild(el('div', 'step-subtitle', step.subtitle));

  const existing = session.answers[step.id];
  let noIdea = !!(existing && existing.no_idea === true);
  let value = (existing && typeof existing.value === 'number') ? existing.value : Math.round((step.max - step.min) / 2 / step.step) * step.step;
  // The thumb has to start somewhere, but that starting point is not the
  // respondent's guess: Continue stays off until they move it, type a
  // number, or say they have no idea.
  let touched = !!existing;

  const valueEl = el('div', 'slider-value', formatMoney(value, step.unit));
  card.appendChild(valueEl);

  const input = document.createElement('input');
  input.type = 'range'; input.min = step.min; input.max = step.max; input.step = step.step; input.value = value;
  card.appendChild(input);

  const hint = el('div', 'slider-hint', 'Drag the slider or type an amount.');
  card.appendChild(hint);

  const exactRow = el('div', 'exact-amount-row');
  exactRow.appendChild(el('label', null, step.unit));
  const exactInput = document.createElement('input');
  exactInput.className = 'exact-amount-input'; exactInput.type = 'text'; exactInput.inputMode = 'numeric';
  exactInput.value = Number(value).toLocaleString('en-IN');
  exactRow.appendChild(exactInput);
  card.appendChild(exactRow);

  input.oninput = () => {
    value = Number(input.value); valueEl.textContent = formatMoney(value, step.unit);
    exactInput.value = value.toLocaleString('en-IN');
    if (noIdea) setNoIdea(false);
    markTouched();
  };
  exactInput.oninput = () => {
    const digits = exactInput.value.replace(/[^\d]/g, '');
    const n = Math.min(step.max, Math.max(step.min, Number(digits) || 0));
    value = n; valueEl.textContent = formatMoney(value, step.unit); input.value = n;
    if (noIdea) setNoIdea(false);
    markTouched();
  };
  exactInput.onblur = () => { exactInput.value = value.toLocaleString('en-IN'); };

  const noIdeaBtn = el('button', 'no-idea-btn' + (noIdea ? ' active' : ''), step.noIdeaLabel || 'No idea');
  function setNoIdea(v) { noIdea = v; noIdeaBtn.classList.toggle('active', v); input.style.opacity = v ? '0.4' : '1'; exactInput.style.opacity = v ? '0.4' : '1'; valueEl.style.opacity = (v || !touched) ? '0.35' : '1'; }
  setNoIdea(noIdea);
  noIdeaBtn.onclick = () => { setNoIdea(!noIdea); markTouched(); };
  card.appendChild(noIdeaBtn);

  const row = el('div', 'action-row');
  const btn = el('button', 'btn btn-primary btn-full', 'Continue');
  btn.disabled = !touched;
  function markTouched() { touched = true; btn.disabled = false; hint.style.visibility = 'hidden'; if (!noIdea) valueEl.style.opacity = '1'; }
  if (touched) hint.style.visibility = 'hidden';
  exactInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && touched) btn.click(); });
  btn.onclick = () => commitAndAdvance(step, { value: noIdea ? null : value, no_idea: noIdea });
  row.appendChild(btn);
  card.appendChild(row);
}
function formatMoney(n, unit) { return unit + Number(n).toLocaleString('en-IN'); }

/* ---- scale (1-5) ---- */
function renderScale(card, step) {
  card.appendChild(el('div', 'step-title', step.title));
  const row = el('div', 'scale-row');
  const existing = session.answers[step.id];
  for (let i = 1; i <= 5; i++) {
    const dot = el('button', 'scale-dot' + (existing === i ? ' selected' : ''), String(i));
    dot.onclick = () => { highlightThen(dot, row, '.scale-dot', () => commitAndAdvance(step, i)); };
    row.appendChild(dot);
  }
  card.appendChild(row);
  const labels = el('div', 'scale-labels');
  labels.appendChild(el('span', null, step.scaleLabels[0]));
  labels.appendChild(el('span', null, step.scaleLabels[1]));
  card.appendChild(labels);
}

function highlightThen(node, container, siblingSelector, cb) {
  container.querySelectorAll(siblingSelector).forEach(n => n.classList.remove('selected'));
  node.classList.add('selected');
  setTimeout(cb, 240);
}

/* ---- single choice (auto-advance); 'row' layout renders compact pills ---- */
function renderSingle(card, step) {
  card.appendChild(el('div', 'step-title', step.title));
  if (step.subtitle) card.appendChild(el('div', 'step-subtitle', step.subtitle));
  const existing = session.answers[step.id];

  if (step.layout === 'row') {
    const row = el('div', 'options-row');
    step.options.forEach(opt => {
      const pill = el('button', 'option-pill' + (existing === opt ? ' selected' : ''), opt);
      pill.onclick = () => highlightThen(pill, row, '.option-pill', () => commitAndAdvance(step, opt));
      row.appendChild(pill);
    });
    card.appendChild(row);
  } else {
    const list = el('div', 'options-list');
    step.options.forEach(opt => {
      const card_ = el('button', 'option-card' + (existing === opt ? ' selected' : ''));
      card_.appendChild(el('span', 'option-dot'));
      card_.appendChild(el('span', null, opt));
      card_.onclick = () => highlightThen(card_, list, '.option-card', () => commitAndAdvance(step, opt));
      list.appendChild(card_);
    });
    card.appendChild(list);
  }
  // Optional questions whose options already include "Prefer not to say"
  // don't need a second, identical escape hatch underneath.
  if (step.optional && !step.options.includes('Prefer not to say')) card.appendChild(skipRow(step));
}

/* ---- single choice built from a prior multi-select answer (Q23) ---- */
function renderSingleFromPrior(card, step) {
  const source = session.answers[step.sourceQuestion];
  const options = (source && source.length) ? source : ['Nothing has stopped me, I still might apply'];
  renderSingle(card, { ...step, options, optional: false });
}

/* ---- multi-select chips ---- */
function renderMultiChips(card, step) {
  card.appendChild(el('div', 'step-title', step.title));
  card.appendChild(el('div', 'step-subtitle', step.subtitle || 'Pick all that apply.'));
  const list = el('div', 'options-list');
  const existing = new Set(session.answers[step.id] || []);
  let otherText = (session.answers[step.id + '_other_text']) || '';
  let otherInput;
  const btn = el('button', 'btn btn-primary btn-full', 'Continue');

  step.options.forEach(opt => {
    const card_ = el('button', 'option-card chip' + (existing.has(opt) ? ' selected' : ''));
    card_.appendChild(el('span', 'option-dot'));
    card_.appendChild(el('span', null, opt));
    card_.onclick = () => {
      if (existing.has(opt)) existing.delete(opt); else existing.add(opt);
      card_.classList.toggle('selected');
      if (opt === 'Other' && otherInput) otherInput.style.display = existing.has('Other') ? 'block' : 'none';
      btn.disabled = existing.size === 0;
    };
    list.appendChild(card_);
  });
  card.appendChild(list);

  if (step.allowOtherText) {
    otherInput = document.createElement('input');
    otherInput.className = 'text-input'; otherInput.placeholder = 'Please specify';
    otherInput.style.display = existing.has('Other') ? 'block' : 'none';
    otherInput.value = otherText;
    card.appendChild(otherInput);
  }

  const row = el('div', 'action-row');
  btn.disabled = existing.size === 0;
  btn.onclick = () => {
    const values = Array.from(existing);
    recordAnswer(step.id, values);
    if (step.allowOtherText && existing.has('Other')) recordAnswer(step.id + '_other_text', otherInput.value.trim());
    goNext();
  };
  row.appendChild(btn);
  card.appendChild(row);
}

/* ---- text (short / long) ---- */
let datalistCounter = 0;
function renderText(card, step) {
  card.appendChild(el('div', 'step-title', step.title));
  if (step.subtitle) card.appendChild(el('div', 'step-subtitle', step.subtitle));

  const input = document.createElement(step.type === 'long_text' ? 'textarea' : 'input');
  input.className = step.type === 'long_text' ? 'textarea-input' : 'text-input';
  if (step.type === 'short_text') input.type = step.inputType || 'text';
  if (step.inputMode) input.inputMode = step.inputMode;
  input.placeholder = step.placeholder || '';
  input.value = session.answers[step.id] || '';

  if (step.suggestions && step.suggestions.length) {
    const listId = 'dl_' + step.id + '_' + (datalistCounter++);
    const dl = document.createElement('datalist');
    dl.id = listId;
    step.suggestions.forEach(s => { const o = document.createElement('option'); o.value = s; dl.appendChild(o); });
    card.appendChild(dl);
    input.setAttribute('list', listId);
  }

  card.appendChild(input);

  // Required written answers: no suggested answers (they'd put words in
  // people's mouths), just a low bar that's easy to clear. A sentence is
  // enough, you can say it instead of typing it, and Continue unlocks at a
  // few real words so "idk" or "." can't slip through.
  const isWritten = step.type === 'long_text' && !step.optional;
  const wordCount = () => input.value.trim().split(/\s+/).filter(w => /[\p{L}\p{N}]/u.test(w)).length;
  const enoughWords = () => !isWritten || wordCount() >= MIN_WRITTEN_WORDS;
  let hintEl = null;
  if (isWritten) {
    input.placeholder = step.placeholder || 'Type your answer…';
    const voiceRow = el('div', 'voice-row');
    hintEl = el('span', 'answer-hint');
    voiceRow.appendChild(hintEl);
    const mic = buildVoiceButton(input, () => syncWritten());
    if (mic) voiceRow.appendChild(mic);
    card.appendChild(voiceRow);
  }

  if (step.quickFill) {
    const qf = el('div', 'quick-fill-row');
    const b = el('button', 'quick-fill-btn', step.quickFill);
    b.onclick = () => commitAndAdvance(step, step.quickFill);
    qf.appendChild(b);
    card.appendChild(qf);
  }

  const row = el('div', 'action-row');
  if (step.optional) {
    const skip = el('button', 'btn btn-ghost', 'Skip');
    skip.onclick = () => { recordAnswer(step.id, ''); goNext(); };
    row.appendChild(skip);
  }
  const btn = el('button', 'btn btn-primary btn-full', 'Continue');
  function syncWritten() {
    if (!isWritten) return;
    const ok = enoughWords();
    btn.disabled = !ok;
    hintEl.classList.toggle('ok', ok);
    hintEl.textContent = ok ? 'That’s perfect. Add more if you like.' : wordCount() === 0 ? 'A sentence is plenty.' : 'A few more words…';
  }
  input.addEventListener('input', syncWritten);
  syncWritten();
  btn.onclick = () => {
    stopVoice();
    if (!enoughWords()) { input.focus(); return; }
    const v = input.value.trim();
    if (!step.optional && v.length === 0) { input.focus(); showToast(step.quickFill ? 'Type an answer, or tap “' + step.quickFill + '”.' : 'Even a few words helps.'); return; }
    if (step.inputType === 'email' && !isValidEmail(v)) { input.focus(); showToast('Enter a valid email so we can send you the results.'); return; }
    commitAndAdvance(step, v);
  };
  submitOnEnter(input, btn);
  row.appendChild(btn);
  card.appendChild(row);
}
function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

const MIN_WRITTEN_WORDS = 4;

/* ---- voice input (Web Speech API; Chrome / Android / Safari). Returns null
   where unsupported, so the field quietly stays type-only. ---- */
const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRecognition = null;
function stopVoice() { if (activeRecognition) { try { activeRecognition.stop(); } catch { /* already stopped */ } } }

function buildVoiceButton(input, onChange) {
  if (!SpeechRecognitionImpl) return null;
  const btn = el('button', 'voice-btn');
  btn.type = 'button';
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg><span>Say it instead</span>';
  const label = btn.querySelector('span');
  let rec = null;

  btn.onclick = () => {
    if (rec) { rec.stop(); return; }
    stopVoice();
    rec = new SpeechRecognitionImpl();
    rec.lang = 'en-IN';
    rec.continuous = true;
    rec.interimResults = true;
    const base = input.value.trim();
    rec.onresult = (e) => {
      let spoken = '';
      for (let i = 0; i < e.results.length; i++) spoken += e.results[i][0].transcript;
      input.value = (base ? base + ' ' : '') + spoken.trim();
      onChange();
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showToast('Microphone is blocked. You can type instead.');
      else if (e.error !== 'no-speech' && e.error !== 'aborted') showToast('Couldn’t hear that. Try again or type it.');
    };
    rec.onend = () => {
      rec = null; activeRecognition = null;
      btn.classList.remove('listening'); label.textContent = 'Say it instead';
      onChange();
    };
    try {
      rec.start();
      activeRecognition = rec;
      btn.classList.add('listening'); label.textContent = 'Listening… tap to stop';
    } catch { rec = null; showToast('Couldn’t start the microphone. You can type instead.'); }
  };
  return btn;
}

function skipRow(step) {
  const row = el('div', 'action-row');
  const skip = el('button', 'btn btn-ghost btn-full', 'Skip');
  skip.onclick = () => { recordAnswer(step.id, ''); goNext(); };
  row.appendChild(skip);
  return row;
}

/* ---- reveal / live stats ---- */
async function renderReveal(card, step) {
  card.appendChild(el('div', 'step-title', step.title));
  const statWrap = el('div', 'stat-row');
  statWrap.appendChild(el('div', 'step-subtitle', 'Loading how others answered…'));
  card.appendChild(statWrap);

  if (step.showUnlockBar) card.appendChild(await buildUnlockBar());

  const row = el('div', 'action-row');
  const btn = el('button', 'btn btn-primary btn-full', step.primaryLabel || 'Continue');
  btn.onclick = () => commitAndAdvance(step, undefined);
  row.appendChild(btn);
  card.appendChild(row);

  const stats = await fetchStatsFor(step.statsFor);
  statWrap.innerHTML = '';
  if (!stats.length) {
    statWrap.appendChild(el('div', 'step-subtitle', 'You’re one of the first to answer. Thank you! We’ll have real comparisons soon.'));
    return;
  }
  stats.forEach(s => {
    const pill = el('div', 'stat-pill');
    pill.appendChild(el('span', null, s.label));
    pill.appendChild(el('b', null, s.value));
    statWrap.appendChild(pill);
  });
}

/** Pulls aggregate counts from the public `question_stats` view for the given question ids. */
async function fetchStatsFor(questionIds) {
  if (!supabaseClient) return []; // demo mode: no live stats to show
  try {
    const { data, error } = await supabaseClient
      .from('question_stats')
      .select('question_id, value, n')
      .in('question_id', questionIds);
    if (error || !data || !data.length) return [];

    const results = [];
    for (const qid of questionIds) {
      const rows = data.filter(r => r.question_id === qid);
      const total = rows.reduce((s, r) => s + r.n, 0);
      if (total === 0) continue;
      if (qid === 'q8_awareness') {
        const newsToMe = rows.find(r => safeParse(r.value) === 'No, this is news to me');
        if (newsToMe) results.push({ label: 'had never heard this was possible', value: Math.round(100 * newsToMe.n / total) + '%' });
      } else if (qid === 'q10_cost_guess') {
        results.push({ label: 'people have guessed the cost so far', value: String(total) });
      } else {
        const top = rows.sort((a, b) => b.n - a.n)[0];
        results.push({ label: 'most common answer: ' + safeParse(top.value), value: Math.round(100 * top.n / total) + '%' });
      }
    }
    return results;
  } catch { return []; }
}
function safeParse(v) { try { return typeof v === 'string' ? JSON.parse(v) : v; } catch { return v; } }

async function buildUnlockBar() {
  const wrap = el('div', 'unlock-bar-wrap');
  const track = el('div', 'unlock-bar-track');
  const fill = el('div', 'unlock-bar-fill'); fill.style.width = '2%';
  track.appendChild(fill);
  wrap.appendChild(track);
  const label = el('div', 'unlock-bar-label', 'Loading…');
  wrap.appendChild(label);

  if (supabaseClient) {
    try {
      const { data } = await supabaseClient.from('survey_progress').select('started').single();
      const started = data?.started || 0;
      const pct = Math.min(100, Math.round(100 * started / CONFIG.unlockTarget));
      fill.style.width = pct + '%';
      label.textContent = `${started} of ${CONFIG.unlockTarget} responses. Real costs and the partner list unlock then.`;
    } catch { label.textContent = 'Real costs and the partner list unlock once we have enough responses.'; }
  } else {
    label.textContent = 'Real costs and the partner list unlock once we have enough responses.';
  }
  return wrap;
}

/* ============================================================================
   8. DEBRIEF + BOARDING PASS
   ========================================================================== */
function renderDebrief() {
  session.completed = true;
  persistSession();
  pushSessionSnapshot();

  const email = session.answers.email_signup;
  if (email) {
    queueWrite({
      kind: 'contact', session_id: session.session_id, email,
      phone_whatsapp: session.answers.q52_contact_detail || session.answers.q34_contact || session.answers.q45_contact_detail || '',
      ok_followup_contact: session.answers.q52_contact_ok === 'Yes' || session.answers.q52_contact_ok === 'Yes, email is fine',
      ok_junior_contact: session.answers.q45_junior_contact === 'Yes, happy to' || session.answers.q45_junior_contact === 'Yes, but only over email',
      ok_interview_contact: session.answers.q34_willing_to_talk === 'Yes',
    });
  }

  stage.innerHTML = '';
  backBtn.classList.remove('visible');
  headerStatus.textContent = 'Done';
  document.body.classList.remove('is-welcome');
  progressFill.style.width = '100%';
  routePlane.style.left = '96%';
  renderStageList(3, true);
  routeDestLabel.textContent = statusForBranch();
  sideHeadline.textContent = 'Your boarding pass is ready.';
  document.getElementById('sideFootnote').style.visibility = 'hidden'; // "pick up where you left off" no longer applies

  const card = el('div', 'step-card');

  const stamp = el('div', 'stamp');
  stamp.appendChild(el('div', 'stamp-line1', 'Checked'));
  stamp.appendChild(el('div', 'stamp-line2', 'In'));
  card.appendChild(stamp);

  card.appendChild(el('div', 'step-title', 'Thank you, genuinely.'));
  card.appendChild(el('div', 'step-subtitle',
    'IITR does have semester exchange agreements with universities abroad, run through the International Relations office. Applications typically open early in the calendar year. We’re deliberately not naming numbers yet. That’s what this survey is for, but we’ll send what we find to the email you gave us.'));

  card.appendChild(buildBoardingPass());

  const shareRow = el('div', 'action-row');
  const shareBtn = el('button', 'btn btn-primary btn-full', 'Share your boarding pass');
  shareBtn.onclick = shareBoardingPass;
  shareRow.appendChild(shareBtn);
  card.appendChild(shareRow);

  card.appendChild(el('div', 'step-subtitle',
    'If you know someone who’s been on exchange, or who started an application and dropped it, please send them this. Those two groups are the hardest for us to reach and the most useful to hear from.'));

  stage.appendChild(card);
}

function statusForBranch() {
  return { A: 'Standby', B: 'Delayed', C: 'Boarded' }[session.branch] || 'Checked in';
}

function sequenceCode() {
  return 'ERC' + session.session_id.replace(/-/g, '').slice(0, 6).toUpperCase();
}

function gateCode() {
  const dept = session.answers.q4_department;
  if (!dept) return 'TBD';
  const letters = dept.split(/\s+/).map(w => w.replace(/[^A-Za-z]/g, '')[0]).filter(Boolean).join('').toUpperCase();
  return letters ? letters.slice(0, 3) : 'TBD';
}

function destinationField() {
  if (session.branch === 'C' && session.answers.q35_university_country_term) {
    return session.answers.q35_university_country_term.toUpperCase();
  }
  return 'DESTINATION TBD';
}

function buildBoardingPass() {
  const ticket = el('div', 'ticket'); ticket.id = 'boardingPassCard';
  const body = el('div', 'ticket-body');
  const main = el('div', 'ticket-main');

  const topline = el('div', 'ticket-topline');
  topline.appendChild(el('span', null, 'Boarding Pass'));
  topline.appendChild(el('span', null, 'Exchange Reality Check'));
  main.appendChild(topline);

  main.appendChild(el('div', 'ticket-passenger-label', 'Passenger'));
  main.appendChild(el('div', 'ticket-passenger-name', (session.answers.respondent_name || 'Guest').toUpperCase()));

  const grid = el('div', 'ticket-grid');
  addField(grid, 'From', 'IIT Roorkee (IITR)');
  addField(grid, 'To', destinationField());
  addField(grid, 'Status', statusForBranch());
  addField(grid, 'Gate', gateCode());
  addField(grid, 'Seq', sequenceCode());
  addField(grid, 'Date', new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase());
  main.appendChild(grid);
  body.appendChild(main);

  body.appendChild(el('div', 'ticket-divider'));

  const answers = el('div', 'ticket-answers');
  answers.appendChild(el('div', 'ticket-answers-label', 'Your answers'));
  const guess = session.answers.q10_cost_guess;
  addAnswerRow(answers, 'Your cost guess', guess && !guess.no_idea ? formatMoney(guess.value, '₹') : 'No idea');
  addAnswerRow(answers, 'Awareness', session.answers.q8_awareness || 'N/A');
  addAnswerRow(answers, 'Would use one info page', session.answers.q50_single_page_usefulness ? session.answers.q50_single_page_usefulness + ' / 5' : 'N/A');
  addAnswerRow(answers, 'Programme', session.answers.q2_programme || 'N/A');
  body.appendChild(answers);
  ticket.appendChild(body);

  ticket.appendChild(el('div', 'ticket-divider'));

  const stub = el('div', 'ticket-stub');
  const seqBlock = el('div', 'ticket-stub-seq');
  const seqLabel = el('span', null, 'Sequence');
  seqBlock.appendChild(seqLabel);
  seqBlock.appendChild(document.createTextNode(sequenceCode()));
  stub.appendChild(seqBlock);
  const barcode = el('div', 'barcode');
  barcode.style.background = buildBarcodeGradient(session.session_id);
  stub.appendChild(barcode);
  ticket.appendChild(stub);

  return ticket;
}
function addField(container, label, value) {
  const d = document.createElement('div');
  d.appendChild(el('div', 'ticket-field-label', label));
  d.appendChild(el('div', 'ticket-field-value', String(value)));
  container.appendChild(d);
}
function addAnswerRow(container, label, value) {
  const row = el('div', 'ticket-answer-row');
  row.appendChild(el('span', null, label));
  row.appendChild(el('b', null, String(value)));
  container.appendChild(row);
}
/** A deterministic, unique-looking barcode pattern derived from the session id. */
function buildBarcodeGradient(seed) {
  const chars = seed.replace(/-/g, '').split('');
  let pos = 0; const stops = [];
  for (let i = 0; i < chars.length && pos < 100; i++) {
    const barWidth = ((parseInt(chars[i], 16) || 1) % 4) + 1.5;
    stops.push(`var(--ink) ${pos}%`, `var(--ink) ${pos + barWidth}%`, `transparent ${pos + barWidth}%`, `transparent ${pos + barWidth + 1.2}%`);
    pos += barWidth + 1.2;
  }
  return `repeating-linear-gradient(90deg, ${stops.join(', ')})`;
}

async function shareBoardingPass() {
  const node = document.getElementById('boardingPassCard');
  try {
    const canvas = await html2canvas(node, { backgroundColor: '#F7F1E2', scale: 2 });
    canvas.toBlob(async (blob) => {
      const file = new File([blob], 'exchange-reality-check-boarding-pass.png', { type: 'image/png' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Exchange Reality Check' }); return; } catch { /* cancelled or unsupported, fall through */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'exchange-reality-check-boarding-pass.png';
      document.body.appendChild(a); a.click(); a.remove();
      showToast('Saved. Share it from your photos.');
    }, 'image/png');
  } catch {
    showToast('Couldn’t generate an image. Try a screenshot instead.');
  }
}

/* ============================================================================
   9. OPTIONAL: Gemini-assisted empathetic one-liner after a long free-text
      answer. Off by default (CONFIG.enableReflections). Calls a proxy YOU
      deploy, never the raw Gemini API from the browser, since that would
      expose your key. Fully non-blocking: a failure here never stops the
      survey.
   ========================================================================== */
async function maybeReflect(step, answerText) {
  if (!CONFIG.enableReflections || !CONFIG.geminiProxyUrl || !answerText || answerText.length < 12) return null;
  try {
    return await withBackoff(async () => {
      const res = await fetch(CONFIG.geminiProxyUrl, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: step.title, answer: answerText }),
      });
      if (!res.ok) throw new Error('reflection HTTP ' + res.status);
      const data = await res.json();
      return data.reflection || null;
    }, { maxAttempts: 2 }); // reflections are a nicety, fail fast and don't hold up the flow
  } catch { return null; }
}

/* ============================================================================
   10. BOOT
   ========================================================================== */
(function boot() {
  if (!isConfigured.supabase && !isConfigured.sheets) {
    const banner = document.getElementById('devBanner');
    banner.style.display = 'block';
    banner.textContent = 'Demo mode. Supabase and Sheets aren’t configured yet, so answers only save to this browser. See README.md.';
  }
  // NOTE: session.pointer === null is a meaningful state (the survey is
  // complete; see advancePointer()'s final `return null` and
  // renderDebrief()). Only a truly uninitialized session (pointer ===
  // undefined, i.e. this object didn't come from the default literal above
  // or from a prior save) should be reset to the first step. Treating null
  // and undefined the same here would bounce a finished respondent back to
  // the welcome screen on every reload.
  if (session.pointer === undefined) session.pointer = { tier: 0, index: 0 };
  if (!session.branch && session.answers.q18_category) session.branch = routeBranch(session.answers.q18_category);
  flushQueue();
  const resuming = session.pointer && !(session.pointer.tier === 0 && session.pointer.index === 0);
  render();
  if (resuming) showToast('Welcome back. Picking up where you left off.');
})();
